name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
      - run: uv run pytest --cov=eom_email_watcher --cov-report=term-missing

  windows-operation-lock:
    runs-on: windows-latest
    env:
      CONNECT_CONTRACTS_DIR: ${{ github.workspace }}\connect-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: canfieldjuan/connect-contracts
          ref: 3005d82a7be885fba36f8688b5967a5b56a0abea
          path: connect-contracts
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: >-
          uv run pytest
          tests/test_config.py::test_packaged_tzdata_supports_default_zone_without_system_database
          tests/test_engine_api.py::test_read_operations_are_versioned_and_do_not_expose_token_paths
          tests/test_engine_api.py::test_check_defers_delivery_until_state_checked_ack

  windows-package:
    runs-on: windows-latest
    env:
      CONNECT_CONTRACTS_DIR: ${{ github.workspace }}\connect-contracts
      LOCAL_CONNECT_ENTITLEMENT_KEYRING_FILE: ${{ github.workspace }}\connect-contracts\entitlements\v1\release\keyring.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: canfieldjuan/connect-contracts
          ref: 3005d82a7be885fba36f8688b5967a5b56a0abea
          path: connect-contracts
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - run: uv run pytest tests/test_desktop_packaging.py
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Build Windows NSIS installer
        run: pnpm --dir desktop tauri build --bundles nsis
      - uses: actions/checkout@v7
        with:
          ref: 43a850d8b00cddfdad2a767b7b27fc792707b010
          path: cutover-predecessor
      - name: Qualify native existing-database NSIS cutover and startup races
        shell: pwsh
        run: |
          $triple = (rustc --print host-tuple).Trim()
          $setup = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one actual NSIS setup' }
          uv run python scripts/prove_windows_cutover.py $setup[0].FullName "desktop/src-tauri/binaries/eom-mail-engine-$triple.exe" cutover-predecessor "$env:RUNNER_TEMP/ew-source-cutover"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify native polling capture analysis retention Connect and timeout retry
        run: >-
          uv run pytest -v
          tests/test_windows_cutover.py
          tests/test_thread_bodies_round4.py
          tests/test_thread_bodies.py
          tests/test_thread_reconcile.py::test_check_backfills_vendor_mail_before_current_poll_cursor
          tests/test_service.py::test_exact_allowlist_and_dedup
          tests/test_service.py::test_public_check_processes_current_pending_work_without_watch_selectors
          tests/test_source_exclusion.py::test_legacy_drain_timeout_keeps_marker_unset_and_retry_adopts
          tests/test_source_exclusion.py::test_selected_legacy_operation_excludes_drain_until_mutation_finishes
          tests/test_source_exclusion.py::test_legacy_cleanup_batches_are_bounded_and_do_not_split_units
          tests/test_source_exclusion.py::test_legacy_cleanup_context_does_not_authorize_nested_connect
          tests/test_source_exclusion.py::test_post_with_refused_outcome_reconciles_without_second_post
          tests/test_connect_v2_engine_api.py::test_automation_submission_requires_connect_entitlement_before_provider_post
          tests/test_connect_v2_engine_api.py::test_connect_entitlement_is_rechecked_after_source_fetch_before_provider_post
          --junitxml=${{ runner.temp }}/ew-source-cutover/native-integration.xml
      - name: Preserve native cutover qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: email-watcher-windows-source-cutover
          path: |
            ${{ runner.temp }}/ew-source-cutover/qualification.json
            ${{ runner.temp }}/ew-source-cutover/*/*.log
            ${{ runner.temp }}/ew-source-cutover/*/installer.*
            ${{ runner.temp }}/ew-source-cutover/native-integration.xml
          if-no-files-found: error
      - name: Verify Windows engine process-tree lifecycle
        run: >-
          cargo test --release --manifest-path desktop/src-tauri/Cargo.toml
          engine::tests::windows_job_ -- --test-threads=1
      - name: Re-run packaged engine acceptance smoke
        shell: pwsh
        run: |
          $triple = (rustc --print host-tuple).Trim()
          uv run --project . python scripts/smoke_packaged_engine.py "desktop/src-tauri/binaries/eom-mail-engine-$triple.exe" --expected-entitlement-state missing
      - uses: actions/upload-artifact@v7
        with:
          name: email-watcher-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --project .. --locked --all-groups
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: ../scripts/build-desktop-sidecar.sh
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Exercise real native deployment refusal and desktop receiver
        run: >-
          uv run --project .. python ../scripts/run_deployment_receiver_proof.py
          src-tauri/binaries/eom-mail-engine-$(rustc --print host-tuple)
          --manifest src-tauri/Cargo.toml
      - run: pnpm tauri build --no-bundle
