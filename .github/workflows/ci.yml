name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
      - run: uv run pytest --cov=eom_email_watcher --cov-report=term-missing

  windows-operation-lock:
    runs-on: windows-latest
    env:
      CONNECT_CONTRACTS_DIR: ${{ github.workspace }}\connect-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: canfieldjuan/connect-contracts
          ref: 3005d82a7be885fba36f8688b5967a5b56a0abea
          path: connect-contracts
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: >-
          uv run pytest
          tests/test_cli.py::test_doctor_uses_the_active_imap_provider_checks
          tests/test_cli.py::test_doctor_windows_fixture_reuses_native_private_anchor
          tests/test_cli.py::test_doctor_windows_uses_shared_directory_validation
          tests/test_cli.py::test_doctor_windows_refuses_unsafe_directory
          tests/test_cli.py::test_doctor_native_windows_dacl
          tests/test_config.py::test_packaged_tzdata_supports_default_zone_without_system_database
          tests/test_engine_api.py::test_read_operations_are_versioned_and_do_not_expose_token_paths
          tests/test_engine_api.py::test_check_defers_delivery_until_state_checked_ack

  windows-package:
    runs-on: windows-latest
    env:
      CONNECT_CONTRACTS_DIR: ${{ github.workspace }}\connect-contracts
      LOCAL_CONNECT_ENTITLEMENT_KEYRING_FILE: ${{ github.workspace }}\connect-contracts\entitlements\v1\release\keyring.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: canfieldjuan/connect-contracts
          ref: 3005d82a7be885fba36f8688b5967a5b56a0abea
          path: connect-contracts
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - run: uv run pytest tests/test_desktop_packaging.py
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          uv run python scripts/windows_cutover_parity.py record "$env:RUNNER_TEMP/ew-source-cutover/full"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop tauri build --bundles nsis --verbose 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ew-source-cutover/full/nsis-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/windows_catalog_retry_fixture.py "$env:RUNNER_TEMP/ew-source-cutover/full/nsis-build.log" "$env:RUNNER_TEMP/ew-source-cutover/full/nsis-compiler.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v7
        with:
          ref: 43a850d8b00cddfdad2a767b7b27fc792707b010
          path: cutover-predecessor
      - name: Probe native token context and transcript exit controls
        shell: pwsh
        run: |
          uv run python scripts/probe_windows_cutover_context.py "$env:RUNNER_TEMP/ew-source-cutover/context"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify native existing-database NSIS cutover and startup races
        shell: pwsh
        run: |
          $triple = (rustc --print host-tuple).Trim()
          $setup = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one actual NSIS setup' }
          uv run python scripts/prove_windows_cutover.py $setup[0].FullName "desktop/src-tauri/binaries/eom-mail-engine-$triple.exe" cutover-predecessor "$env:RUNNER_TEMP/ew-source-cutover"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify native polling capture analysis retention Connect and timeout retry
        if: success() || failure()
        env:
          EW_QUALIFICATION_TEST_OUTPUT: ${{ runner.temp }}/ew-source-cutover/native-tests
        run: >-
          uv run pytest -v
          tests/test_windows_cutover.py
          tests/test_config.py
          tests/test_thread_migration.py
          tests/test_windows_cutover_round9.py
          tests/test_windows_context_probe.py
          tests/test_gmail_recovery_retention.py
          tests/test_thread_bodies_round4.py
          tests/test_thread_bodies.py
          tests/test_certificate_expiry_ledger.py
          tests/test_cli.py
          tests/test_connect_v2_engine_api.py
          tests/test_db.py
          tests/test_deferred_removal.py
          tests/test_engine_api.py
          tests/test_ntfy_disclosure_migration.py
          tests/test_platform_contract.py
          tests/test_positive_deployment.py
          tests/test_removal_refusal.py
          tests/test_service.py
          tests/test_source_exclusion.py
          tests/test_source_observations.py
          tests/test_thread_bodies_review.py
          tests/test_thread_derived.py
          tests/test_thread_migration.py
          tests/test_thread_reconcile.py
          tests/test_thread_reconcile_round2.py
          --junitxml=${{ runner.temp }}/ew-source-cutover/native-integration.xml
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare separately labelled fixture-authority qualification build
        shell: pwsh
        run: |
          $triple = (rustc --print host-tuple).Trim()
          $setup = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one production-authority setup' }
          uv run python scripts/build_windows_cutover_qualification.py "$env:RUNNER_TEMP/ew-source-cutover/full" "desktop/src-tauri/binaries/eom-mail-engine-$triple.exe" $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle test-only authority with the same NSIS hooks and desktop
        shell: pwsh
        run: |
          pnpm --dir desktop tauri build --bundles nsis --config "$env:RUNNER_TEMP/ew-source-cutover/full/qualification-config.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify populated upgrade through installed receipt-gated engine
        shell: pwsh
        run: |
          $triple = (rustc --print host-tuple).Trim()
          $setup = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected one test-only qualification setup' }
          uv run python scripts/windows_cutover_parity.py verify "$env:RUNNER_TEMP/ew-source-cutover/full" --installer $setup[0].FullName --engine "desktop/src-tauri/binaries/eom-mail-engine-$triple.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/prove_windows_cutover_full.py $setup[0].FullName "desktop/src-tauri/binaries/eom-mail-engine-$triple.exe" cutover-predecessor "$env:RUNNER_TEMP/ew-source-cutover/full"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native cutover qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: email-watcher-windows-source-cutover
          path: |
            ${{ runner.temp }}/ew-source-cutover/qualification.json
            ${{ runner.temp }}/ew-source-cutover/context/**/*.json
            ${{ runner.temp }}/ew-source-cutover/context/**/*.ps1
            ${{ runner.temp }}/ew-source-cutover/context/**/*.txt
            ${{ runner.temp }}/ew-source-cutover/**/tokens.json
            ${{ runner.temp }}/ew-source-cutover/standard-user-*.json
            ${{ runner.temp }}/ew-source-cutover/standard-inputs.json
            ${{ runner.temp }}/ew-source-cutover/native-process-state.json
            ${{ runner.temp }}/ew-source-cutover/native-tests/**/*.json
            ${{ runner.temp }}/ew-source-cutover/native-tests/**/*.log
            ${{ runner.temp }}/ew-source-cutover/**/case-cleanup.json
            ${{ runner.temp }}/ew-source-cutover/**/task-state-query.json
            ${{ runner.temp }}/ew-source-cutover/*/scheduled-task-state.json
            ${{ runner.temp }}/ew-source-cutover/**/*.log
            ${{ runner.temp }}/ew-source-cutover/**/installer.*
            ${{ runner.temp }}/ew-source-cutover/**/cutover-*.txt
            ${{ runner.temp }}/ew-source-cutover/*/package-programs.json
            ${{ runner.temp }}/ew-source-cutover/native-integration.xml
            ${{ runner.temp }}/ew-source-cutover/full/build-inventory.json
            ${{ runner.temp }}/ew-source-cutover/full/release-engine.exe
            ${{ runner.temp }}/ew-source-cutover/full/release-payload/**/eom-email-watcher-desktop.exe
            ${{ runner.temp }}/ew-source-cutover/full/qualification-payload/**/eom-email-watcher-desktop.exe
            desktop/src-tauri/binaries/eom-mail-engine-x86_64-pc-windows-msvc.exe
            ${{ runner.temp }}/ew-source-cutover/full/nsis-compiler.json
            ${{ runner.temp }}/ew-source-cutover/full/release-sources.json
            ${{ runner.temp }}/ew-source-cutover/full/parity.json
            ${{ runner.temp }}/ew-source-cutover/full/qualification.json
            ${{ runner.temp }}/ew-source-cutover/full/operations.jsonl
            ${{ runner.temp }}/ew-source-cutover/full/greenmail.log
            ${{ runner.temp }}/ew-source-cutover/full/java-version.txt
            ${{ runner.temp }}/ew-source-cutover/full/installer.*
          if-no-files-found: error
      - name: Verify Windows engine process-tree and removal lifecycle
        run: >-
          cargo test --release --lib --manifest-path desktop/src-tauri/Cargo.toml
          -- --test-threads=1
      - name: Re-run packaged engine acceptance smoke
        shell: pwsh
        run: |
          uv run --project . python scripts/smoke_packaged_engine.py "$env:RUNNER_TEMP/ew-source-cutover/full/release-engine.exe" --expected-entitlement-state missing
      - uses: actions/upload-artifact@v7
        with:
          name: email-watcher-windows-nsis
          path: ${{ runner.temp }}/ew-source-cutover/full/release-installer.exe
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --project .. --locked --all-groups
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: ../scripts/build-desktop-sidecar.sh
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Exercise real native deployment refusal and desktop receiver
        run: >-
          uv run --project .. python ../scripts/run_deployment_receiver_proof.py
          src-tauri/binaries/eom-mail-engine-$(rustc --print host-tuple)
          --manifest src-tauri/Cargo.toml
      - run: pnpm tauri build --no-bundle
