timezone = "America/Chicago"
body_char_limit = 20000
retention_days = 180
poll_interval_minutes = 120
gmail_credentials_file = "~/.local/state/eom-email-watcher/credentials.json"
microsoft_credentials_file = "~/.local/state/eom-email-watcher/microsoft-oauth-client.json"
gmail_token_file = "~/.local/state/eom-email-watcher/token.json"
gmail_send_token_file = "~/.local/state/eom-email-watcher/send-token.json"
monthly_hours_recipient = "billing-contact@example.com"
database_file = "~/.local/state/eom-email-watcher/watcher.sqlite3"
model_backend = "loopback"
model_base_url = "http://127.0.0.1:1234/v1"
model_name = "your-local-model-identifier"
model_api_token_file = "~/.local/state/eom-email-watcher/lmstudio-api-token"
model_require_auth = true
model_timeout_seconds = 60
# To use an administrator-managed on-prem inference gateway instead, set:
# model_backend = "gateway"
# model_base_url = "https://inference.example.internal"
# model_api_token_file = "~/.local/state/eom-email-watcher/gateway-credential"
# model_ca_file = "~/.local/state/eom-email-watcher/gateway-ca.pem"
# model_name is ignored in gateway mode; worker/model selection stays on the appliance.
notifications_enabled = true
# Optional content-bearing phone push via ntfy (https://ntfy.sh).
# Enabling this sends the configured topic and numeric priority plus:
# - title: watched sender label/address and email subject
# - message: local model summary, optional suggested action and deadline; or
#   fallback/review text that can contain email-derived content
# HTTPS protects transit only. The ntfy service can read and may retain or log
# these fields. The topic is subscription/publish access, not content encryption.
# For confidentiality-sensitive mail, leave ntfy_topic unset and use desktop
# notifications. To accept this disclosure, uncomment BOTH the topic and the
# literal acknowledgement. Generate a long random topic, e.g.:
# python3 -c "import secrets; print('eom-email-watch-' + secrets.token_hex(6))"
# ntfy_topic = "eom-email-watch-xxxxxxxxxxxx"
# ntfy_content_disclosure_acknowledged = true
# ntfy_url = "https://ntfy.sh"

[[senders]]
email = "billing@example.com"
name = "Example Billing"

[[senders]]
email = "contact@example.org"
