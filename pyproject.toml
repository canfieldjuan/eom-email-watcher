[project]
name = "eom-email-watcher"
version = "0.1.0"
description = "Private Gmail sender watcher with local-only email summarization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "filelock>=3.18,<4",
  "google-api-python-client>=2.179,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "tomlkit>=0.13,<1",
]

[project.scripts]
eom-mail-watch = "eom_email_watcher.cli:main"
eom-mail-engine = "eom_email_watcher.engine_api:main"
eom-model-benchmark = "eom_email_watcher.benchmark:main"
eom-llama-cpp-proof = "eom_email_watcher.llama_cpp_proof:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.16,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
